name: Deploy Public Folder to Pages

on:
  push:
    branches: [ "main" ] # Đổi thành "master" nếu bạn dùng master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Thay cho actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      - name: Setup Pages
        # Thay cho actions/configure-pages@v5
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b 

      - name: Upload artifact
        # Thay cho actions/upload-pages-artifact@v3
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dee4966286e9 
        with:
          # Chỉ định đưa thư mục public lên trang web
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        # Thay cho actions/deploy-pages@v4
        uses: actions/deploy-pages@d6db90164ad5ed86f2b6a8737221803cf87cf287 
        
