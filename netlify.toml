"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Static site: publish the existing GitHub Pages artifact directory.
# No Ruby, Jekyll, package installation, or build step is required.
[build]
  command = "echo 'No build needed'"
  publish = "public"

# Pull-request Deploy Previews publish the same static artifact.
[context.deploy-preview]
  command = "echo 'No build needed'"
  publish = "public"

# Never publish the Production context from this repository.
# Pull requests remain eligible for Deploy Preview builds.
[context.production]
  ignore = "exit 0"
